<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesquisa - Salários Pagos por Igrejas Batistas a Pastores Auxiliares e Ministros</title>
  <script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=LqSKjHZdBfLYN8MqZqZrnvePvR6FpySOblU2JoEvqdpT51K4vNXoNKoD_Er67lugGnl6MsvYT_S9Mu5BGMy9NOEg1ZdjWYu1vwHfRFMdmw8Bi6t2PtbnH2dXvKY4Sy1BZZDTdj9Ax1qG7c_yIWXGpbAj-n_jEsuOtohQNfBoYvFHYPPau4pr9HTUOjzjV_2hVmxoll-RnDMqaBN7PFXw_giUrNbei9eivueYXYyvOtgFTBKveHX1pNkFxsTTVvlO1QDHQ47Qc-RIctwwLidbIy4O36_YcGcdpTcROljuLbYiXL_s1DPHubVFCG68-YAj5Ycr8ZOn2KC3n2jzLSOAl1RXzdj87odVgjcB2fog3K8" charset="UTF-8"></script><style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #1e3a5f;
      --primary-hover: #162c48;
      --accent: #3b82f6;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 48px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .header-card {
      background: var(--card);
      border-top: 6px solid var(--primary);
      border-radius: var(--radius);
      padding: 32px 28px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .header-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .header-subtitle {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.04em;
      margin: 14px 0 10px;
      text-align: center;
    }

    .header-card p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .item-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      border: 1px solid #e5e7eb;
      transition: border-color 0.2s ease;
    }

    .item-card:focus-within {
      border-color: var(--accent);
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background: var(--primary);
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 14px;
    }

    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label.field-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      background: #fafafa;
      transition: all 0.15s ease;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    textarea {
      min-height: 68px;
      resize: vertical;
    }

    .regime-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding-top: 4px;
    }

    .checkbox-option {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      color: var(--text);
      background: #f9fafb;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      user-select: none;
    }

    .checkbox-option:hover {
      background: #f3f4f6;
    }

    .checkbox-option input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      background: var(--card);
      padding: 20px 28px;
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 11px 18px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-secondary:hover {
      background: #f0f4f8;
    }

    .footer-note {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <form id="pesquisaForm">
      <div class="header-card">
        <h1>Pesquisa – Salários Pagos por Igrejas Batistas a Pastores Auxiliares e Ministros</h1>
        <div class="header-subtitle">– IGREJA "X" –</div>
        <p>Preencha abaixo os cargos existentes na igreja, os respectivos valores salariais, regime de dedicação e benefícios adicionais.</p>
      </div>

      <div id="itemsContainer"></div>

      <div class="actions">
        <button type="button" class="btn-secondary" onclick="copiarRespostas()">Copiar Respostas</button>
        <button type="submit" class="btn-primary">Enviar Respostas por E-mail</button>
      </div>
    </form>

    <div class="footer-note">
      Destinatário das respostas: <strong>igreja@ibmatadapraia.org.br</strong>
    </div>
  </div>

  <script>
    const container = document.getElementById("itemsContainer");

    for (let i = 1; i <= 10; i++) {
      const card = document.createElement("div");
      card.className = "item-card";
      card.innerHTML = `
        <div class="item-title">
          <span class="badge">${i}</span>
          <span>Registro ${i}</span>
        </div>
        <div class="grid-2">
          <div class="field">
            <label class="field-label" for="cargo_${i}">${i}) Cargo:</label>
            <input type="text" id="cargo_${i}" name="cargo_${i}" placeholder="Ex.: Pastor Auxiliar, Ministro de Música..." />
          </div>
          <div class="field">
            <label class="field-label" for="salario_${i}">Salário:</label>
            <input type="text" id="salario_${i}" name="salario_${i}" placeholder="Ex.: R$ 0,00" />
          </div>
        </div>
        <div class="field">
          <label class="field-label">Regime de Trabalho:</label>
          <div class="regime-group">
            <label class="checkbox-option">
              <input type="radio" name="regime_${i}" value="Tempo Integral" />
              <span>Tempo Integral</span>
            </label>
            <label class="checkbox-option">
              <input type="radio" name="regime_${i}" value="Tempo Parcial" />
              <span>Tempo Parcial</span>
            </label>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="beneficios_${i}">Benefícios Adicionais:</label>
          <textarea id="beneficios_${i}" name="beneficios_${i}" placeholder="Ex.: Plano de saúde, auxílio moradia, vale-alimentação, 13º, férias..."></textarea>
        </div>
      `;
      container.appendChild(card);
    }

    function montarTextoResumo() {
      let texto = "PESQUISA - SALÁRIOS PAGOS POR IGREJAS BATISTAS A PASTORES AUXILIARES E MINISTROS\n";
      texto += '– IGREJA "X" –\n';
      texto += "------------------------------------------------------------\n\n";

      let algumPreenchido = false;

      for (let i = 1; i <= 10; i++) {
        const cargo = document.getElementById(`cargo_${i}`).value.trim();
        const salario = document.getElementById(`salario_${i}`).value.trim();
        const regimeEl = document.querySelector(`input[name="regime_${i}"]:checked`);
        const regime = regimeEl ? regimeEl.value : "Não informado";
        const beneficios = document.getElementById(`beneficios_${i}`).value.trim();

        if (cargo || salario || regimeEl || beneficios) {
          algumPreenchido = true;
          texto += `${i}) CARGO: ${cargo || "-"}\n`;
          texto += `   SALÁRIO: ${salario || "-"} | REGIME: ${regime}\n`;
          texto += `   BENEFÍCIOS ADICIONAIS: ${beneficios || "-"}\n\n`;
        }
      }

      if (!algumPreenchido) {
        texto += "(Nenhum cargo preenchido no formulário)\n";
      }

      return texto;
    }

    function copiarRespostas() {
      const texto = montarTextoResumo();
      navigator.clipboard.writeText(texto).then(() => {
        alert("Respostas copiadas! Caso prefira, cole diretamente no seu e-mail para igreja@ibmatadapraia.org.br.");
      });
    }

    document.getElementById("pesquisaForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const assunto = encodeURIComponent('Pesquisa Salarial - Igreja "X"');
      const corpo = encodeURIComponent(montarTextoResumo());
      window.location.href = `mailto:igreja@ibmatadapraia.org.br?subject=${assunto}&body=${corpo}`;
    });
  </script>
</body>
</html>
